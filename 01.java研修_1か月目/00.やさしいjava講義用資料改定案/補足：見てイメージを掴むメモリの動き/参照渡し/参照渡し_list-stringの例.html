<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Memory - ArrayList & String Detailed</title>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --primary: #3b82f6;
            --secondary: #10b981;
            --string-color: #8b5cf6;
            --accent: #f59e0b;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --stack-bg: #f8fafc;
            --heap-bg: #f0fdf4;
            --console-bg: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            display: flex; gap: 20px; width: 100%; max-width: 1200px;
            height: 65vh; min-height: 550px;
        }

        .code-panel {
            flex: 0.8; background: #282c34; color: #d1d5db; padding: 20px;
            border-radius: 12px; font-family: 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.85rem; line-height: 1.5; overflow: hidden;
        }
        .line { padding: 2px 10px; border-radius: 4px; transition: 0.2s; opacity: 0.7; border-left: 4px solid transparent; white-space: pre; }
        .line.active { opacity: 1; background: #3e4451; border-left-color: var(--accent); color: #fff; }

        .memory-panel {
            flex: 2; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border);
            position: relative; display: flex; flex-direction: column; padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .memory-header { font-weight: bold; font-size: 0.75rem; color: var(--text-sub); text-transform: uppercase; margin-bottom: 5px; }

        .stack-area {
            flex: 0 0 160px; background: var(--stack-bg); border-radius: 10px; border: 2px solid var(--border);
            margin-bottom: 15px; display: flex; flex-direction: column-reverse; padding: 10px; gap: 8px; position: relative; z-index: 5;
        }
        .stack-frame { border: 1px solid #cbd5e1; background: rgba(255,255,255,0.8); border-radius: 6px; padding: 8px; position: relative; }
        .frame-label { position: absolute; top: -7px; right: 8px; font-size: 0.6rem; background: #94a3b8; color: white; padding: 1px 5px; border-radius: 3px; }

        .stack-var { width: 120px; padding: 4px 8px; border-radius: 5px; background: #fff; border: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 4px; }
        .var-ref { border-left: 3px solid var(--secondary); }

        .heap-area { flex: 1; background: var(--heap-bg); border-radius: 10px; border: 2px dashed var(--secondary); position: relative; overflow: hidden; }
        
        .heap-obj-list { 
            position: absolute; background: #fff; border: 2px solid var(--secondary); border-radius: 8px; 
            padding: 10px; min-width: 150px; top: 20px; left: 30px; z-index: 20;
        }
        .list-slot-container { display: flex; flex-direction: column; gap: 4px; margin-top: 5px; }
        .list-slot { 
            border: 1px solid #ddd; padding: 4px; font-size: 0.7rem; background: #f9f9f9; 
            border-radius: 4px; display: flex; justify-content: space-between; min-height: 1.2rem;
        }

        .heap-obj-string {
            position: absolute; background: #fff; border: 2px solid var(--string-color); border-radius: 20px;
            padding: 5px 15px; font-size: 0.9rem; font-weight: bold; color: var(--string-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 20; animation: pop 0.3s ease-out;
        }

        #connector-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        .console-container { width: 100%; max-width: 1200px; margin-top: 15px; background: var(--console-bg); border-radius: 8px; padding: 12px; color: #fff; font-family: 'Consolas', monospace; font-size: 0.9rem; }
        .console-title { font-size: 0.7rem; color: #94a3b8; margin-bottom: 5px; border-bottom: 1px solid #475569; padding-bottom: 3px; }
        .console-line { color: #10b981; min-height: 1.2em; }

        .footer { margin-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .commentary { font-size: 1rem; font-weight: 500; background: #fff; padding: 8px 25px; border-radius: 30px; border: 1px solid var(--border); min-height: 1.5em; text-align: center; max-width: 900px;}
        button { padding: 8px 20px; border-radius: 8px; border: none; background: var(--text-main); color: #fff; font-weight: 600; cursor: pointer; }

        @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .update-flash { animation: flash 0.8s; }
        @keyframes flash { 0% { background-color: var(--accent); color: white; } 100% { background-color: white; color: inherit; } }
        .frame-exit { animation: frame-out 0.4s forwards; }
        @keyframes frame-out { to { opacity: 0; filter: blur(5px); transform: scale(0.9); } }
    </style>
</head>
<body>

    <h2 style="margin: 0 0 10px 0;">Java Memory: Nested References (Step-by-Step)</h2>

    <div class="container">
        <div class="code-panel">
            <div class="line" id="l1">List&lt;String&gt; list = new ArrayList&lt;&gt;();</div>
            <div class="line" id="l2">list.add("Java");</div>
            <div class="line" id="l3">addJS(list);</div>
            <div class="line" id="l4">System.out.println(list);</div>
            <div style="margin: 8px 0; height: 1px; background: #444; opacity: 0.3;"></div>
            <div class="line" id="l5">void addJS(List&lt;String&gt; myList) {</div>
            <div class="line" id="l6">  myList.add("JS");</div>
            <div class="line" id="l7">}</div>
        </div>

        <div class="memory-panel" id="memory-root">
            <svg id="connector-canvas"></svg>
            <div class="memory-header">Stack</div>
            <div class="stack-area" id="stack-area"></div>
            <div class="memory-header">Heap (Object Instances)</div>
            <div class="heap-area" id="heap-area"></div>
        </div>
    </div>

    <div class="console-container">
        <div class="console-title">Console Output</div>
        <div class="console-line" id="console-out"></div>
    </div>

    <div class="footer">
        <div class="commentary" id="commentary">「次へ」で開始</div>
        <div class="btn-group">
            <button id="nextBtn" onclick="nextStep()">次へ進む</button>
            <button onclick="location.reload()" style="background:#fff; color:#333; border:1px solid #ccc;">リセット</button>
        </div>
    </div>

<script>
    let step = -1;
    const flow = [
        { line: 'l1', msg: "【定義】mainフレーム内に、List型の変数 list の箱を用意します。", 
          action: () => { createFrame('main'); pushVar('main', 'list', 'null', 'var-ref'); } },
        { line: 'l1', msg: "【代入】new ArrayList() をヒープに作り、その住所(0x11)を格納します。", 
          action: () => { addListHeap('list-obj', '0x11'); updateVar('main', 'list', '0x11'); setTimeout(() => drawArrow('main-list', 'list-obj', '#10b981'), 400); } },
        
        { line: 'l2', msg: "【定義】ヒープの別の場所に String \"Java\" (住所:0xS1) を用意します。", 
          action: () => { addStringHeap('str-java', 'Java', 280, 40); } },
        { line: 'l2', msg: "【代入】ArrayListのスロットに、Stringの住所(0xS1)を書き込みます。", 
          action: () => { addListSlot('list-obj', '0xS1', 'str-java'); } },

        { line: 'l3', msg: "addJS(list) メソッドを呼び出します。", 
          action: () => { } },

        { line: 'l5', msg: "【定義】addJSフレームが作られ、引数 myList の箱が用意されます。", 
          action: () => { createFrame('addJS'); pushVar('addJS', 'myList', 'null', 'var-ref'); } },
        { line: 'l5', msg: "【代入】呼び出し元(main)から、リストの住所(0x11)がコピーされます。", 
          action: () => { updateVar('addJS', 'myList', '0x11'); setTimeout(() => drawArrow('addJS-myList', 'list-obj', '#10b981'), 400); } },

        { line: 'l6', msg: "【定義】新たに String \"JS\" (住所:0xS2) をヒープに用意します。", 
          action: () => { addStringHeap('str-js', 'JS', 280, 110); } },
        { line: 'l6', msg: "【代入】同じリストの次のスロットに、住所(0xS2)を書き込みます。", 
          action: () => { addListSlot('list-obj', '0xS2', 'str-js'); } },

        { line: 'l7', msg: "メソッドが終了。制御が戻り、addJSフレームは破棄されます。", 
          action: () => { 
              const f = document.getElementById('frame-addJS'); 
              if(f) f.classList.add('frame-exit'); 
              document.querySelectorAll('[id*="arrow-addJS"]').forEach(a => a.remove()); 
          } },

        { line: 'l4', msg: "println実行。list -> ArrayList -> String と住所を2回辿って値を集めます。", 
          action: () => { } },
        { line: 'l4', msg: "出力：[Java, JS]。メソッド内での参照経由の操作が反映されています。", 
          action: () => { document.getElementById('console-out').innerText = "> [Java, JS]"; } }
    ];

    function highlightLine(id) {
        document.querySelectorAll('.line').forEach(l => l.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function createFrame(name) {
        const div = document.createElement('div');
        div.id = `frame-${name}`; div.className = 'stack-frame';
        div.innerHTML = `<div class="frame-label">${name}()</div><div id="vars-${name}"></div>`;
        document.getElementById('stack-area').appendChild(div);
    }

    function pushVar(frameName, varName, val, className) {
        const container = document.getElementById(`vars-${frameName}`);
        const div = document.createElement('div');
        div.id = `var-${frameName}-${varName}`; div.className = `stack-var ${className}`;
        div.innerHTML = `<span>${varName}</span><strong>${val}</strong>`;
        container.appendChild(div);
    }

    function updateVar(frameName, varName, newVal) {
        const el = document.getElementById(`var-${frameName}-${varName}`);
        if(!el) return;
        el.querySelector('strong').innerText = newVal;
        el.classList.add('update-flash');
        setTimeout(() => el.classList.remove('update-flash'), 800);
    }

    function addListHeap(id, addr) {
        const div = document.createElement('div');
        div.id = id; div.className = 'heap-obj-list';
        div.innerHTML = `<div class="obj-title">ArrayList (addr:${addr})</div><div class="list-slot-container" id="${id}-slots"></div>`;
        document.getElementById('heap-area').appendChild(div);
    }

    function addListSlot(listId, strAddr, strObjId) {
        const container = document.getElementById(`${listId}-slots`);
        const slotId = `${listId}-slot-${container.children.length}`;
        const div = document.createElement('div');
        div.id = slotId; div.className = 'list-slot';
        div.innerHTML = `<span>index:${container.children.length}</span><strong>${strAddr}</strong>`;
        container.appendChild(div);
        setTimeout(() => drawHeapToHeapArrow(slotId, strObjId), 300);
    }

    function addStringHeap(id, text, x, y) {
        const div = document.createElement('div');
        div.id = id; div.className = 'heap-obj-string';
        div.innerText = `"${text}"`;
        div.style.left = x + 'px'; div.style.top = y + 'px';
        document.getElementById('heap-area').appendChild(div);
    }

    function drawArrow(varId, objId, color) {
        const fromEl = document.getElementById(`var-${varId}`);
        const toEl = document.getElementById(objId);
        if(!fromEl || !toEl) return;
        const rootRect = document.getElementById('memory-root').getBoundingClientRect();
        const fRect = fromEl.getBoundingClientRect();
        const tRect = toEl.getBoundingClientRect();

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.id = `arrow-${varId}`;
        const x1 = fRect.right - rootRect.left; const y1 = fRect.top + fRect.height/2 - rootRect.top;
        const x2 = tRect.left - rootRect.left; const y2 = tRect.top + tRect.height/2 - rootRect.top;
        const cp1x = x1 + (x2 - x1) * 0.4;
        path.setAttribute('d', `M ${x1} ${y1} C ${cp1x} ${y1}, ${cp1x} ${y2}, ${x2} ${y2}`);
        path.setAttribute('stroke', color); path.setAttribute('stroke-width', '2'); path.setAttribute('fill', 'none');
        document.getElementById('connector-canvas').appendChild(path);
    }

    function drawHeapToHeapArrow(slotId, strId) {
        const fromEl = document.getElementById(slotId);
        const toEl = document.getElementById(strId);
        const rootRect = document.getElementById('memory-root').getBoundingClientRect();
        const fRect = fromEl.getBoundingClientRect();
        const tRect = toEl.getBoundingClientRect();

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const x1 = fRect.right - rootRect.left; const y1 = fRect.top + fRect.height/2 - rootRect.top;
        const x2 = tRect.left - rootRect.left; const y2 = tRect.top + tRect.height/2 - rootRect.top;
        path.setAttribute('d', `M ${x1} ${y1} L ${x2} ${y2}`);
        path.setAttribute('stroke', '#8b5cf6'); path.setAttribute('stroke-width', '1.5'); path.setAttribute('stroke-dasharray', '4'); path.setAttribute('fill', 'none');
        document.getElementById('connector-canvas').appendChild(path);
    }

    function nextStep() {
        if (step < flow.length - 1) {
            step++;
            const current = flow[step];
            highlightLine(current.line);
            document.getElementById('commentary').innerText = current.msg;
            current.action();
        } else {
            document.getElementById('nextBtn').disabled = true;
        }
    }
</script>
</body>
</html>
