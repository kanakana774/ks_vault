<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Java Memory - Frame Pop & Return Flow</title>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --stack-color: #3b82f6;
            --accent: #f59e0b; 
            --text-main: #1e293b;
            --border: #e2e8f0;
            --console-bg: #1e293b;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; gap: 15px; width: 100%; max-width: 1100px; height: 60vh; min-height: 500px; }

        .code-panel { flex: 0.9; background: #282c34; color: #d1d5db; padding: 20px; border-radius: 12px; font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 0.85rem; line-height: 1.4; overflow-y: auto; }
        .line { padding: 1px 8px; border-radius: 4px; transition: 0.2s; opacity: 0.7; border-left: 4px solid transparent; white-space: pre; }
        .line.active { opacity: 1; background: #3e4451; border-left-color: var(--accent); color: #fff; }

        .memory-panel { flex: 1.5; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); position: relative; display: flex; flex-direction: column; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .memory-header { font-weight: bold; font-size: 0.65rem; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }

        .stack-area { flex: 1; background: #f8fafc; border-radius: 10px; border: 2px solid var(--border); display: flex; flex-direction: column-reverse; padding: 10px; gap: 10px; position: relative; }
        .stack-frame { border: 1px solid #cbd5e1; background: rgba(255,255,255,0.9); border-radius: 6px; padding: 10px; position: relative; transition: 0.5s; opacity: 1; }
        .frame-label { position: absolute; top: -7px; right: 8px; font-size: 0.55rem; background: #94a3b8; color: white; padding: 1px 4px; border-radius: 3px; }
        .stack-var { width: 140px; padding: 4px 10px; border-radius: 5px; background: #fff; border: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 5px; position: relative; }
        
        .return-ball {
            position: absolute; width: 32px; height: 32px; background: var(--accent);
            color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.9rem; z-index: 100; box-shadow: 0 0 15px var(--accent);
            pointer-events: none; opacity: 0; transform: scale(0); transition: opacity 0.3s, transform 0.3s;
        }

        .footer { margin-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .commentary { font-size: 1rem; font-weight: 500; background: #fff; padding: 8px 25px; border-radius: 30px; border: 1px solid var(--border); text-align: center; max-width: 850px; min-height: 1.5em;}
        button { padding: 10px 24px; border-radius: 8px; border: none; background: var(--text-main); color: #fff; font-weight: 600; cursor: pointer; }

        .update-flash { animation: flash 0.8s; }
        @keyframes flash { 0% { background-color: var(--accent); color: white; transform: scale(1.1); } 100% { background-color: white; color: inherit; transform: scale(1); } }
        .frame-pop-anim { opacity: 0; transform: translateY(-30px) scale(0.9); filter: blur(10px); }
    </style>
</head>
<body>

    <h2 style="margin: 0 0 10px 0;">Java Memory: Frame Pop & Method Return</h2>

    <div class="container">
        <div class="code-panel">
<div class="line" id="l1">class MyUtils {</div>
<div class="line" id="l2">  static int add(int a, int b) {</div>
<div class="line" id="l3">    int result = a + b;</div>
<div class="line" id="l4">    return result;</div>
<div class="line" id="l5">  }</div>
<div class="line" id="l6">}</div>
<div class="line" id="l7">public class Main {</div>
<div class="line" id="l8">  public static void main(String[] args) {</div>
<div class="line" id="l9">    int sum = MyUtils.add(10, 20);</div>
<div class="line" id="l10">    System.out.println(sum);</div>
<div class="line" id="l11">  }</div>
<div class="line" id="l12">}</div>
        </div>

        <div class="memory-panel" id="memory-root">
            <div class="memory-header">Stack (LIFO)</div>
            <div class="stack-area" id="stack-area"></div>
            <!-- 戻り値の玉 -->
            <div id="return-ball" class="return-ball"></div>
        </div>
    </div>

    <div class="footer">
        <div class="commentary" id="commentary">「次へ進む」で開始</div>
        <div class="btn-group">
            <button id="nextBtn" onclick="nextStep()">次へ進む</button>
            <button onclick="location.reload()" style="background:#fff; color:#333; border:1px solid #ccc; padding: 8px 20px; border-radius: 8px; cursor: pointer; margin-left: 10px;">リセット</button>
        </div>
    </div>

<script>
    let step = -1;

    const flow = [
        { line: 'l8', msg: "プログラム開始。mainのスタックフレームが作られます。", action: () => { createFrame('main'); } },
        
        { line: 'l9', msg: "int sum = ... の実行。右辺のaddメソッドが終わるまで待機します。", action: () => { pushVar('main', 'sum', '...', 'var-primitive'); } },
        
        { line: 'l2', msg: "MyUtils.add(10, 20) を呼び出し。新しいフレームが上に積まれます。", action: () => { createFrame('add'); pushVar('add', 'a', '10', ''); pushVar('add', 'b', '20', ''); } },

        { line: 'l3', msg: "計算結果 30 をメソッド内の result に格納します。", action: () => { pushVar('add', 'result', '30', ''); } },

        { line: 'l4', msg: "【return】値を返す準備。30 が『戻り値』として確定しました。", action: () => { 
            const resVar = document.getElementById('var-add-result');
            resVar.classList.add('update-flash');
            // 玉をresultの位置に出現させる
            const ball = document.getElementById('return-ball');
            const rect = resVar.getBoundingClientRect();
            const rootRect = document.getElementById('memory-root').getBoundingClientRect();
            ball.style.top = (rect.top - rootRect.top) + 'px';
            ball.style.left = (rect.left - rootRect.left) + 'px';
            ball.innerText = '30';
            ball.style.opacity = '1';
            ball.style.transform = 'scale(1)';
        } },

        { line: 'l9', msg: "【Pop!】addフレームが消滅！同時に、値が呼び出し元へ戻り、sum に代入されます。", action: () => { 
            // 1. ハイライトをmainに戻す (flow制御で自動)
            // 2. フレーム消滅アニメーション
            const frame = document.getElementById('frame-add');
            frame.classList.add('frame-pop-anim');

            // 3. 玉の移動開始
            const ball = document.getElementById('return-ball');
            const targetRect = document.getElementById('var-main-sum').getBoundingClientRect();
            const rootRect = document.getElementById('memory-root').getBoundingClientRect();
            
            ball.style.transition = 'all 0.6s cubic-bezier(0.5, 0, 0.5, 1)';
            ball.style.top = (targetRect.top - rootRect.top) + 'px';
            ball.style.left = (targetRect.left - rootRect.left) + 'px';

            // 4. 到着後の処理
            setTimeout(() => {
                ball.style.opacity = '0';
                ball.style.transform = 'scale(0)';
                frame.remove();
                updateVar('main', 'sum', '30'); // ついに確定
            }, 600);
        } },

        { line: 'l10', msg: "println：無事に受け取った 30 を出力します。", action: () => { 
            document.getElementById('commentary').innerHTML += "<br><strong style='color:#10b981'>> 30</strong>";
        } }
    ];

    function highlightLine(id) { document.querySelectorAll('.line').forEach(l => l.classList.remove('active')); const t = document.getElementById(id); if (t) t.classList.add('active'); }
    function createFrame(n) { const d = document.createElement('div'); d.id=`frame-${n}`; d.className='stack-frame'; d.innerHTML=`<div class="frame-label">${n}()</div><div id="vars-${n}"></div>`; document.getElementById('stack-area').appendChild(d); }
    function pushVar(f, v, val, c) { const con = document.getElementById(`vars-${f}`); if(!con) return; const d = document.createElement('div'); d.id=`var-${f}-${v}`; d.className=`stack-var ${c}`; d.innerHTML=`<span>${v}</span><strong>${val}</strong>`; con.appendChild(d); }
    function updateVar(f, v, n) { const e = document.getElementById(`var-${f}-${v}`); if(e) { e.querySelector('strong').innerText=n; e.classList.add('update-flash'); setTimeout(()=>e.classList.remove('update-flash'), 800); } }

    function nextStep() {
        if (step < flow.length - 1) {
            step++;
            const current = flow[step];
            highlightLine(current.line);
            document.getElementById('commentary').innerText = current.msg;
            current.action();
        } else {
            document.getElementById('nextBtn').disabled = true;
        }
    }
</script>
</body>
</html>
