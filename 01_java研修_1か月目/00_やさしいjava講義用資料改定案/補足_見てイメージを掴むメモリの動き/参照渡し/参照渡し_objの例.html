<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Memory - Complete Flow</title>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --primary: #3b82f6;
            --secondary: #10b981;
            --accent: #f59e0b;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --stack-bg: #f8fafc;
            --heap-bg: #f0fdf4;
            --console-bg: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            display: flex; gap: 20px; width: 100%; max-width: 1100px;
            height: 60vh; min-height: 500px;
        }

        /* 左側：コードパネル */
        .code-panel {
            flex: 1; background: #282c34; color: #d1d5db; padding: 20px;
            border-radius: 12px; font-family: 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.9rem; line-height: 1.5; overflow: hidden;
        }
        .line { padding: 2px 10px; border-radius: 4px; transition: 0.2s; opacity: 0.7; border-left: 4px solid transparent; white-space: pre; }
        .line.active { opacity: 1; background: #3e4451; border-left-color: var(--accent); color: #fff; }

        /* 右側：メモリパネル */
        .memory-panel {
            flex: 1.4; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border);
            position: relative; display: flex; flex-direction: column; padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .memory-header { font-weight: bold; font-size: 0.75rem; color: var(--text-sub); text-transform: uppercase; margin-bottom: 5px; }

        .stack-area {
            flex: 0 0 220px; background: var(--stack-bg); border-radius: 10px; border: 2px solid var(--border);
            margin-bottom: 15px; display: flex; flex-direction: column-reverse; padding: 10px; gap: 8px; position: relative; z-index: 5;
        }
        .stack-frame { border: 1px solid #cbd5e1; background: rgba(255,255,255,0.8); border-radius: 6px; padding: 8px; position: relative; }
        .frame-label { position: absolute; top: -7px; right: 8px; font-size: 0.6rem; background: #94a3b8; color: white; padding: 1px 5px; border-radius: 3px; }

        .stack-var { width: 120px; padding: 4px 8px; border-radius: 5px; background: #fff; border: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 4px; }
        .var-primitive { border-left: 3px solid var(--primary); }
        .var-reference { border-left: 3px solid var(--secondary); }

        .heap-area { flex: 1; background: var(--heap-bg); border-radius: 10px; border: 2px dashed var(--secondary); position: relative; overflow: hidden; }
        .heap-obj { position: absolute; background: #fff; border: 1px solid var(--secondary); border-radius: 8px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-width: 130px; top: 20px; left: 50%; transform: translateX(-50%); }
        .obj-title { font-size: 0.65rem; color: var(--text-sub); border-bottom: 1px solid var(--border); padding-bottom: 3px; }
        .obj-field { display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 4px; }
        .field-val { font-weight: bold; color: var(--secondary); }

        #connector-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        /* コンソールエリア */
        .console-container {
            width: 100%; max-width: 1100px; margin-top: 15px; background: var(--console-bg);
            border-radius: 8px; padding: 12px; color: #fff; font-family: 'Consolas', monospace; font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .console-title { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; border-bottom: 1px solid #475569; padding-bottom: 3px; }
        .console-line { color: #10b981; min-height: 1.2em; }

        .footer { margin-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .commentary { font-size: 1rem; font-weight: 500; background: #fff; padding: 8px 25px; border-radius: 30px; border: 1px solid var(--border); min-height: 1.5em; text-align: center; max-width: 850px;}
        .btn-group { display: flex; gap: 10px; }
        button { padding: 8px 20px; border-radius: 8px; border: none; background: var(--text-main); color: #fff; font-weight: 600; cursor: pointer; }
        button:disabled { background: var(--border); color: var(--text-sub); }

        .update-flash { animation: flash 0.8s; }
        @keyframes flash { 0% { background-color: var(--accent); color: white; } 100% { background-color: white; color: inherit; } }
        .frame-exit { animation: frame-out 0.4s forwards; }
        @keyframes frame-out { to { opacity: 0; filter: blur(5px); transform: scale(0.9); } }
    </style>
</head>
<body>

    <h2 style="margin: 0 0 15px 0;">Java Memory & Method Behavior</h2>

    <div class="container">
        <div class="code-panel">
            <div class="line" id="l1">int a = 10;</div>
            <div class="line" id="l2">Data obj = new Data(100, 10);</div>
            <div class="line" id="l3">update(a, obj);</div>
            <div class="line" id="l4">System.out.println("a=" + a + ", val=" + obj.val);</div>
            <div style="margin: 8px 0; height: 1px; background: #444; opacity: 0.3;"></div>
            <div class="line" id="l5">void update(int n, Data d) {</div>
            <div class="line" id="l6">  n = 50;</div>
            <div class="line" id="l7">  d.val = 50;</div>
            <div class="line" id="l8">}</div>
        </div>

        <div class="memory-panel" id="memory-root">
            <svg id="connector-canvas"></svg>
            <div class="memory-header">Stack (Execution Frames)</div>
            <div class="stack-area" id="stack-area"></div>
            <div class="memory-header">Heap (Object Instances)</div>
            <div class="heap-area" id="heap-area"></div>
        </div>
    </div>

    <div class="console-container">
        <div class="console-title">Console Output</div>
        <div class="console-line" id="console-out"></div>
    </div>

    <div class="footer">
        <div class="commentary" id="commentary">「次へ」で開始</div>
        <div class="btn-group">
            <button id="nextBtn" onclick="nextStep()">次へ進む</button>
            <button onclick="location.reload()" style="background:#fff; color:#333; border:1px solid #ccc;">リセット</button>
        </div>
    </div>

<script>
    let step = -1;
    const flow = [
        { line: 'l1', msg: "【定義】a という箱をスタックに作成します。", action: () => { createFrame('main'); pushVar('main', 'a', '?', 'var-primitive'); } },
        { line: 'l1', msg: "【代入】a に 10 を格納します。", action: () => updateVar('main', 'a', '10') },
        
        { line: 'l2', msg: "【定義】obj という箱を作成します。", action: () => pushVar('main', 'obj', 'null', 'var-reference') },
        { line: 'l2', msg: "【代入】newで作った実体の住所(0x99)を格納します。", action: () => { addHeap('data1', 100, 10); updateVar('main', 'obj', '0x99'); setTimeout(() => drawArrow('main-obj', 'data1'), 400); } },

        { line: 'l3', msg: "updateメソッドを呼び出します。", action: () => { } },

        { line: 'l5', msg: "引数 n と d の箱が用意されます。", action: () => { createFrame('update'); pushVar('update', 'n', '?', 'var-primitive'); pushVar('update', 'd', 'null', 'var-reference'); } },
        { line: 'l5', msg: "mainから値(10)と住所(0x99)がコピーされます。", action: () => { updateVar('update', 'n', '10'); updateVar('update', 'd', '0x99'); setTimeout(() => drawArrow('update-d', 'data1'), 400); } },

        { line: 'l6', msg: "n = 50 : update内の n が変わります。mainの a は独立しているので変わりません。", action: () => updateVar('update', 'n', '50') },
        
        { line: 'l7', msg: "d.val = 50 : 住所 d を通じてヒープ上の実体を書き換えます。", action: () => updateHeapField('data1', 'val', '50') },

        { line: 'l8', msg: "update終了。スタックフレームが破棄されます。", action: () => removeFrame('update') },

        { line: 'l4', msg: "println実行。現在のスタックにある a と、objの指すヒープの中身を確認します。", action: () => { } },
        { line: 'l4', msg: "出力完了：a は 10 のままですが、obj.val は 50 に変わっています！", action: () => { document.getElementById('console-out').innerText = "> a=10, val=50"; } }
    ];

    function highlightLine(id) {
        document.querySelectorAll('.line').forEach(l => l.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function createFrame(name) {
        const div = document.createElement('div');
        div.id = `frame-${name}`; div.className = 'stack-frame';
        div.innerHTML = `<div class="frame-label">${name}()</div><div id="vars-${name}"></div>`;
        document.getElementById('stack-area').appendChild(div);
    }

    function removeFrame(name) {
        const frame = document.getElementById(`frame-${name}`);
        if(frame) frame.classList.add('frame-exit');
        document.querySelectorAll(`[id*="arrow-update"]`).forEach(a => a.remove());
    }

    function pushVar(frameName, varName, val, className) {
        const container = document.getElementById(`vars-${frameName}`);
        const div = document.createElement('div');
        div.id = `var-${frameName}-${varName}`; div.className = `stack-var ${className}`;
        div.innerHTML = `<span>${varName}</span><strong>${val}</strong>`;
        container.appendChild(div);
    }

    function updateVar(frameName, varName, newVal) {
        const el = document.getElementById(`var-${frameName}-${varName}`);
        if(!el) return;
        el.querySelector('strong').innerText = newVal;
        el.classList.add('update-flash');
        setTimeout(() => el.classList.remove('update-flash'), 800);
    }

    function addHeap(id, idVal, valVal) {
        const div = document.createElement('div');
        div.id = id; div.className = 'heap-obj';
        div.innerHTML = `<div class="obj-title">Instance at 0x99</div><div class="obj-field"><span>id:</span><span>${idVal}</span></div><div class="obj-field" id="${id}-val-field"><span>val:</span><span class="field-val">${valVal}</span></div>`;
        document.getElementById('heap-area').appendChild(div);
    }

    function updateHeapField(objId, fieldName, newVal) {
        const field = document.getElementById(`${objId}-${fieldName}-field`);
        field.querySelector('.field-val').innerText = newVal;
        field.classList.add('update-flash');
        setTimeout(() => field.classList.remove('update-flash'), 800);
    }

    function drawArrow(varId, objId) {
        const fromEl = document.getElementById(`var-${varId}`);
        const toEl = document.getElementById(objId);
        if(!fromEl || !toEl) return;
        const rootRect = document.getElementById('memory-root').getBoundingClientRect();
        const fRect = fromEl.getBoundingClientRect();
        const tRect = toEl.getBoundingClientRect();

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.id = `arrow-${varId}`;
        const x1 = fRect.right - rootRect.left; const y1 = fRect.top + fRect.height/2 - rootRect.top;
        const x2 = tRect.left - rootRect.left; const y2 = tRect.top + tRect.height/2 - rootRect.top;
        const cp1x = x1 + (x2 - x1) * 0.4;
        path.setAttribute('d', `M ${x1} ${y1} C ${cp1x} ${y1}, ${cp1x} ${y2}, ${x2} ${y2}`);
        path.setAttribute('stroke', '#10b981'); path.setAttribute('stroke-width', '2.5'); path.setAttribute('fill', 'none');
        document.getElementById('connector-canvas').appendChild(path);
    }

    function nextStep() {
        if (step < flow.length - 1) {
            step++;
            const current = flow[step];
            highlightLine(current.line);
            document.getElementById('commentary').innerText = current.msg;
            current.action();
        } else {
            document.getElementById('nextBtn').disabled = true;
        }
    }
</script>
</body>
</html>
