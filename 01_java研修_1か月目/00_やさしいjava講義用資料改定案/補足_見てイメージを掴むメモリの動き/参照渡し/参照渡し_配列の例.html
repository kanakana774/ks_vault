<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Memory - Array Pass-by-Value</title>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --primary: #3b82f6;
            --secondary: #10b981; /* 参照型：緑 */
            --accent: #f59e0b;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --stack-bg: #f8fafc;
            --heap-bg: #f0fdf4;
            --console-bg: #1e293b;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }

        .container { display: flex; gap: 20px; width: 100%; max-width: 1100px; height: 60vh; min-height: 500px; }

        .code-panel { flex: 0.9; background: #282c34; color: #d1d5db; padding: 20px; border-radius: 12px; font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 0.9rem; line-height: 1.5; overflow: hidden; }
        .line { padding: 2px 10px; border-radius: 4px; transition: 0.2s; opacity: 0.7; border-left: 4px solid transparent; white-space: pre; }
        .line.active { opacity: 1; background: #3e4451; border-left-color: var(--accent); color: #fff; }

        .memory-panel { flex: 1.4; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); position: relative; display: flex; flex-direction: column; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .memory-header { font-weight: bold; font-size: 0.75rem; color: var(--text-sub); text-transform: uppercase; margin-bottom: 5px; }

        .stack-area { flex: 0 0 240px; background: var(--stack-bg); border-radius: 10px; border: 2px solid var(--border); margin-bottom: 15px; display: flex; flex-direction: column-reverse; padding: 10px; gap: 8px; position: relative; z-index: 5; }
        .stack-frame { border: 1px solid #cbd5e1; background: rgba(255,255,255,0.8); border-radius: 6px; padding: 8px; position: relative; }
        .frame-label { position: absolute; top: -7px; right: 8px; font-size: 0.6rem; background: #94a3b8; color: white; padding: 1px 5px; border-radius: 3px; }

        .stack-var { width: 125px; padding: 4px 8px; border-radius: 5px; background: #fff; border: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 4px; }
        .var-ref { border-left: 3px solid var(--secondary); }

        .heap-area { flex: 1; background: var(--heap-bg); border-radius: 10px; border: 2px dashed var(--secondary); position: relative; overflow: hidden; }
        .heap-obj { position: absolute; background: #fff; border: 1px solid var(--secondary); border-radius: 8px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-width: 140px; top: 40px; left: 50%; transform: translateX(-50%); }
        .obj-title { font-size: 0.65rem; color: var(--text-sub); border-bottom: 1px solid var(--border); padding-bottom: 3px; }
        .array-display { display: flex; gap: 6px; margin-top: 8px; justify-content: center; }
        .cell { width: 35px; height: 35px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: bold; background: #fff; border-radius: 4px; }

        #connector-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        .console-container { width: 100%; max-width: 1100px; margin-top: 15px; background: var(--console-bg); border-radius: 8px; padding: 12px; color: #fff; font-family: 'Consolas', monospace; font-size: 0.9rem; }
        .console-title { font-size: 0.7rem; color: #94a3b8; margin-bottom: 5px; border-bottom: 1px solid #475569; padding-bottom: 3px; }
        .console-line { color: #10b981; min-height: 1.2em; }

        .footer { margin-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .commentary { font-size: 1rem; font-weight: 500; background: #fff; padding: 8px 25px; border-radius: 30px; border: 1px solid var(--border); min-height: 1.5em; text-align: center; max-width: 850px;}
        button { padding: 10px 24px; border-radius: 8px; border: none; background: var(--text-main); color: #fff; font-weight: 600; cursor: pointer; }

        .update-flash { animation: flash 0.8s; }
        @keyframes flash { 0% { background-color: var(--accent); color: white; } 100% { background-color: white; color: inherit; } }
        .frame-exit { opacity: 0; filter: blur(5px); transition: 0.4s; }
    </style>
</head>
<body>

    <h2 style="margin: 0 0 10px 0;">Java Memory: Passing Array to Method</h2>

    <div class="container">
        <div class="code-panel">
            <div class="line" id="l1">int[] arr = {1, 2};</div>
            <div class="line" id="l2">update(arr);</div>
            <div class="line" id="l3">System.out.println(arr[0]);</div>
            <div style="margin: 10px 0; height: 1px; background: #444; opacity: 0.3;"></div>
            <div class="line" id="l4">void update(int[] target) {</div>
            <div class="line" id="l5">  target[0] = 99;</div>
            <div class="line" id="l6">}</div>
        </div>

        <div class="memory-panel" id="memory-root">
            <svg id="connector-canvas"></svg>
            <div class="memory-header">Stack (Method Frames)</div>
            <div class="stack-area" id="stack-area"></div>
            <div class="memory-header">Heap (Shared Array)</div>
            <div class="heap-area" id="heap-area"></div>
        </div>
    </div>

    <div class="console-container">
        <div class="console-title">Console Output</div>
        <div class="console-line" id="console-out"></div>
    </div>

    <div class="footer">
        <div class="commentary" id="commentary">「次へ」で開始</div>
        <div class="btn-group">
            <button id="nextBtn" onclick="nextStep()">次へ進む</button>
            <button onclick="location.reload()" style="background:#fff; color:#333; border:1px solid #ccc; padding: 8px 20px; border-radius: 8px; cursor: pointer;">リセット</button>
        </div>
    </div>

<script>
    let step = -1;
    let activeArrows = [];

    const flow = [
        { line: 'l1', msg: "【定義】mainフレーム内に、配列型変数 arr の箱を用意します。", action: () => { createFrame('main'); pushVar('main', 'arr', 'null', 'var-ref'); } },
        { line: 'l1', msg: "【代入】ヒープに実体 {1, 2} を作り、その住所(0x100)を格納します。", action: () => { addHeapArray('arr-obj', [1, 2]); updateVar('main', 'arr', '0x100'); registerArrow('main-arr', 'arr-obj', '#10b981'); } },
        
        { line: 'l2', msg: "update(arr) を呼び出します。制御がメソッド定義へ移動します。", action: () => { } },

        { line: 'l4', msg: "【定義】新しいフレーム update が作られ、引数 target の箱が用意されます。", action: () => { createFrame('update'); pushVar('update', 'target', 'null', 'var-ref'); } },
        { line: 'l4', msg: "【代入】mainの arr から「住所(0x100)」がコピーされます。", action: () => { updateVar('update', 'target', '0x100'); registerArrow('update-target', 'arr-obj', '#10b981'); } },

        { line: 'l5', msg: "【更新】コピーされた住所を使い、ヒープ上の実体の 0番目を 99 に書き換えます。", action: () => updateHeapArray('arr-obj', 0, 99) },

        { line: 'l6', msg: "メソッド終了。updateフレームと target 変数（住所のコピー）が消滅します。", action: () => removeFrame('update') },

        { line: 'l3', msg: "println出力：mainの arr が指す実体は書き換わっているため 99 が表示されます。", action: () => { document.getElementById('console-out').innerText = "> 99"; } }
    ];

    function highlightLine(id) {
        document.querySelectorAll('.line').forEach(l => l.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function createFrame(name) {
        const div = document.createElement('div');
        div.id = `frame-${name}`; div.className = 'stack-frame';
        div.innerHTML = `<div class="frame-label">${name}()</div><div id="vars-${name}"></div>`;
        document.getElementById('stack-area').appendChild(div);
        refreshArrows();
    }

    function removeFrame(name) {
        const frame = document.getElementById(`frame-${name}`);
        if(frame) frame.classList.add('frame-exit');
        activeArrows = activeArrows.filter(a => !a.from.includes(name));
        setTimeout(() => { if(frame) frame.remove(); refreshArrows(); }, 400);
    }

    function pushVar(frameName, varName, val, className) {
        const container = document.getElementById(`vars-${frameName}`);
        const div = document.createElement('div');
        div.id = `var-${frameName}-${varName}`; div.className = `stack-var ${className}`;
        div.innerHTML = `<span>${varName}</span><strong>${val}</strong>`;
        container.appendChild(div);
        setTimeout(refreshArrows, 50);
    }

    function updateVar(frameName, varName, newVal) {
        const el = document.getElementById(`var-${frameName}-${varName}`);
        if(el) {
            el.querySelector('strong').innerText = newVal;
            el.classList.add('update-flash');
            setTimeout(() => el.classList.remove('update-flash'), 800);
        }
    }

    function addHeapArray(id, values) {
        const div = document.createElement('div');
        div.id = id; div.className = 'heap-obj';
        div.innerHTML = `<div class="obj-title">int[] (addr:0x100)</div><div class="array-display" id="${id}-cells">
            ${values.map(v => `<div class="cell">${v}</div>`).join('')}
        </div>`;
        document.getElementById('heap-area').appendChild(div);
    }

    function updateHeapArray(id, index, newVal) {
        const cells = document.getElementById(`${id}-cells`).querySelectorAll('.cell');
        cells[index].innerText = newVal;
        cells[index].classList.add('update-flash');
        setTimeout(() => cells[index].classList.remove('update-flash'), 800);
    }

    function registerArrow(fromVarId, toObjId, color) {
        activeArrows.push({ from: fromVarId, to: toObjId, color: color });
        refreshArrows();
    }

    function refreshArrows() {
        const svg = document.getElementById('connector-canvas');
        svg.innerHTML = '';
        const rootRect = document.getElementById('memory-root').getBoundingClientRect();

        activeArrows.forEach(arrow => {
            const fromEl = document.getElementById(`var-${arrow.from}`);
            const toEl = document.getElementById(arrow.to);
            if(!fromEl || !toEl) return;

            const fRect = fromEl.getBoundingClientRect();
            const tRect = toEl.getBoundingClientRect();

            const x1 = fRect.right - rootRect.left;
            const y1 = fRect.top + fRect.height/2 - rootRect.top;
            const x2 = tRect.left - rootRect.left;
            const y2 = tRect.top + tRect.height/2 - rootRect.top;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const cp1x = x1 + (x2 - x1) * 0.4;
            path.setAttribute('d', `M ${x1} ${y1} C ${cp1x} ${y1}, ${cp1x} ${y2}, ${x2} ${y2}`);
            path.setAttribute('stroke', arrow.color);
            path.setAttribute('stroke-width', '2.5');
            path.setAttribute('fill', 'none');
            svg.appendChild(path);
        });
    }

    function nextStep() {
        if (step < flow.length - 1) {
            step++;
            const current = flow[step];
            highlightLine(current.line);
            document.getElementById('commentary').innerText = current.msg;
            current.action();
        } else {
            document.getElementById('nextBtn').disabled = true;
        }
    }

    window.addEventListener('resize', refreshArrows);
</script>
</body>
</html>
